[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri"]
# L'app Tauri a besoin de WebView2 (Windows) ou webkit2gtk (Linux) : elle n'est
# compilée que si on la cible explicitement (`pnpm tauri dev` / `cargo build -p wowscan-app`).
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/HussonAxel/wowscan"

[workspace.dependencies]
wowscan-core = { path = "crates/core" }
anyhow = "1"
csv = "1"
flate2 = "1"
futures = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "form", "query", "http2", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
